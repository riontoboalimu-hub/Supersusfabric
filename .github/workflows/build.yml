name: Build Super Sus Fabric

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil source code
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ekstrak proyek
        run: |
          unzip SuperSusFabric-1.20.1-Starter.zip -d project

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build mod
        run: |
          cd project/SuperSusFabric-1.20.1
          sed -i "s/1.3-SNAPSHOT/1.6.12/" build.gradle
          gradle build

      - name: Simpan file JAR
        uses: actions/upload-artifact@v4
        with:
          name: SuperSusFabric
          path: project/SuperSusFabric-1.20.1/build/libs/*.jar
